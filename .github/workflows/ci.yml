name: Deploy Streamlit Branch

on:
  push:
    branches:
      - feature/codex-dev
      - feature/enterprise-workflow-graph

jobs:
  streamlit-deploy-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Compile check
        run: python -m compileall .

      - name: Deployment note
        run: |
          echo "Streamlit Cloud will redeploy automatically if the app is configured to track feature/codex-dev."